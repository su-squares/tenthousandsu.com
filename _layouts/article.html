<!doctype html>
<html lang="en" class="article-page">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }}</title>
  <link rel="icon" type="image/svg+xml" href="/assets/images/branding/logomark.svg">
  <link rel="stylesheet" href="/assets/main.css">
  <script src="https://cdn.jsdelivr.net/npm/anchor-js@4.3.1/anchor.min.js" integrity="sha256-0WMZ9PF4b2hTF66Eglv/9H5Vwk6lnOG4AbmCJxo96WQ=" crossorigin="anonymous"></script>
  {% include foot.html %}
</head>
<body>
  <header>
    <a id="logo" href="/"><img src="/assets/images/branding/logo-su-squares.svg" alt="Su Squares logo"></a>
  </header>

  <hr>

  <article class="lead">
      {{ content }}
      <h2>Claim your Square</h2>
      <p>➡️ Next, go to <a href="/">the homepage</a>, and click an available Square to claim it.</p>
  </article>
  {% include footer.html %}
  <script>
    // Add anchors on DOMContentLoaded
    document.addEventListener('DOMContentLoaded', function(event) {
      anchors.add();
    });
  </script>
</body>
</html>
