# This is a basic workflow to help you get started with Actions

name: Load from blockchain

# Controls when the workflow will run
on:
  # Triggers the workflow every hour on the 21st minute
  schedule:
    - cron: "21 * * * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

    # A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  check_for_updates:
    name: Check for updates on-chain since last committed to repository
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Check-out tenthousandsu.com website repository
        uses: actions/checkout@v7

      - name: Check-out update-script repository
        uses: actions/checkout@v7
        with:
          repository: "su-squares/update-script"
          path: "update-script"

      - name: Wire up update-script
        run: |
          mv build update-script/build
          mv erc721 update-script/build/metadata
          echo "PROVIDER_URL=${{ secrets.PROVIDER_URL }}" > update-script/.env

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: update-script/.nvmrc
          cache: "yarn"
          check-latest: true
          cache-dependency-path: "update-script/yarn.lock"

      - name: Install dependencies
        run: |
          cd update-script
          yarn install --immutable

      # GitHub disables this schedule after 60 days with no commit on the default branch.
      # A quiet chain still needs one checkpoint commit before that cutoff.
      - name: Fast-forward the checkpoint after 42 days without a commit
        run: |
          last_commit=$(git log -1 --format=%ct)
          now=$(date +%s)
          age_days=$(( (now - last_commit) / 86400 ))
          echo "Days since last commit: ${age_days}"
          if [ "$age_days" -ge 42 ]; then
            echo "FAST_FORWARD=1" >> "$GITHUB_ENV"
          fi

      # have-there-been-updates exit status:
      #   0  no Square events (FAST_FORWARD=1 may still rewrite loadedTo.json)
      #   1  events found; run load-blockchain
      #   *  provider or script failure; do not treat that as an update
      - name: Run have-there-been-updates
        timeout-minutes: 20
        run: |
          cd update-script
          set +e
          yarn run have-there-been-updates
          status=$?
          set -e
          if [ "$status" -eq 1 ]; then
            echo "LOAD=yes" >> "$GITHUB_ENV"
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Run load-blockchain
        if: env.LOAD == 'yes'
        timeout-minutes: 20
        run: |
          cd update-script
          yarn run load-blockchain

      - name: Export build from update-script
        run: |
          mv update-script/build/metadata erc721
          mv update-script/build build

      - name: Commit back to this repository
        run: |
          git add build erc721
          if git diff --cached --quiet; then
            echo "No checkpoint or Square changes to commit."
            exit 0
          fi
          git config user.name "update-script/load-blockchain.mjs"
          git config user.email "<>"
          git commit -m 'Load from blockchain'
          git push
