# Push a built site to Cloudflare Pages. Cloudflare is not given access to this repo.
# Same direct-upload pattern as modern-training-solutions/public-websites.

name: Preview deployment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  preview:
    name: Preview deployment
    runs-on: ubuntu-latest
    concurrency:
      group: preview-deployments-${{ github.ref }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    outputs:
      preview_url: ${{ steps.deploy.outputs.preview-url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install dependencies
        run: bundle install

      - name: Build site
        run: bundle exec jekyll build --config _config.yml,_config.preview.yml

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # The Pages project is direct upload. This exchanges the wrangler login
      # stored in CLOUDFLARE_REFRESH_TOKEN for the access token wrangler reads.
      - name: Refresh Cloudflare access token
        env:
          CLOUDFLARE_REFRESH_TOKEN: ${{ secrets.CLOUDFLARE_REFRESH_TOKEN }}
        run: |
          node --input-type=module << 'JS'
          import { appendFileSync } from "node:fs";
          const body = new URLSearchParams({
            grant_type: "refresh_token",
            client_id: "54d11594-84e4-41aa-b438-e81b8fa78ee7",
            refresh_token: process.env.CLOUDFLARE_REFRESH_TOKEN,
          });
          const resp = await fetch("https://dash.cloudflare.com/oauth2/token", {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded",
              Accept: "application/json",
              "User-Agent": "wrangler/4.149.0",
            },
            body,
          });
          const payload = await resp.json();
          if (!resp.ok || !payload.access_token) {
            const reason = payload.error_name || payload.error || payload.title || resp.status;
            console.error("Cloudflare login refresh failed:", reason);
            process.exit(1);
          }
          const token = payload.access_token;
          console.log(`::add-mask::${token}`);
          const delim = "CF_TOKEN_END";
          appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_API_TOKEN<<${delim}\n${token}\n${delim}\n`);
          JS

      - name: Install Wrangler CLI
        run: npm i wrangler@4

      - name: Deploy to Cloudflare Pages
        id: deploy
        run: |
          set -euo pipefail
          npx wrangler pages deploy _site --project-name=tenthousandsu-com --branch=${{ github.head_ref || github.ref_name }} | tee /tmp/wrangler.log
          preview_url="$(grep -Eo 'https://[^ ]+\.pages\.dev[^ ]*' /tmp/wrangler.log | tail -n1)"
          test -n "$preview_url"
          echo "preview-url=$preview_url" >> "$GITHUB_OUTPUT"

  post-preview-url:
    name: Post preview URL
    runs-on: ubuntu-latest
    needs: [preview]
    if: github.event_name == 'pull_request' && needs.preview.result == 'success'
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const MARKER = '<!-- preview-url -->';
            const url = '${{ needs.preview.outputs.preview_url }}';
            if (!url) return;
            const branch = context.payload.pull_request.head.ref;
            const body = [
              MARKER,
              '### Preview deployment',
              '',
              url,
              '',
              `Branch: \`${branch}\``,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body.includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
